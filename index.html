    // =========================================================================

    function switchUser(userId) {
      currentUser = USERS[userId];
      activeTab = 'dashboard';
      renderSidebar();
      renderCurrentView();
    }

    function renderSidebar() {
      const navContainer = document.getElementById('sidebarNav');
      const roleLabel = document.getElementById('roleLabelDisplay');
      const roleBadge = document.getElementById('roleBadge');

      roleLabel.innerText = `${currentUser.role.toUpperCase()} NAVIGATION`;
      roleBadge.innerText = currentUser.role.toUpperCase();
      roleBadge.className = currentUser.role === 'admin' ? 'bg-sky-100 text-sky-700 px-2 py-0.5 rounded text-[10px] font-extrabold' :
                            currentUser.role === 'hod' ? 'bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-[10px] font-extrabold' :
                            'bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-[10px] font-extrabold';

      const links = NAV_ITEMS[currentUser.role];
      navContainer.innerHTML = links.map(link => `
        <button onclick="setActiveTab('${link.id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${activeTab === link.id ? 'bg-sky-600 text-white shadow-md font-semibold' : 'text-slate-600 hover:bg-slate-100'}">
          <i data-lucide="${link.icon}" class="w-4 h-4"></i>
          <span>${link.label}</span>
        </button>
      `).join('');
      lucide.createIcons();
    }

    function setActiveTab(tabId) {
      activeTab = tabId;
      renderSidebar();
      renderCurrentView();
    }

    function renderCurrentView() {
      const title = document.getElementById('viewTitle');
      const subtitle = document.getElementById('viewSubtitle');
      const quickActions = document.getElementById('quickActions');
      const content = document.getElementById('tabContent');

      // Update banner header based on tab and role
      if (activeTab === 'dashboard') {
        title.innerText = currentUser.role === 'admin' ? 'Admin Executive Dashboard' :
                          currentUser.role === 'hod' ? `Academic Dashboard (${currentUser.name})` :
                          `My Class Dashboard (${currentUser.scope})`;
        subtitle.innerText = 'Real-time preschool indicators, financial health & student attendance';
        quickActions.innerHTML = currentUser.role === 'admin' ? `
          <button onclick="openAddStudentModal()" class="bg-sky-600 hover:bg-sky-700 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center space-x-1 shadow">
            <i data-lucide="plus" class="w-4 h-4"></i><span>New Admission</span>
          </button>
          <button onclick="openAddExpenseModal()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center space-x-1 shadow">
            <i data-lucide="wallet" class="w-4 h-4"></i><span>Log Expense</span>
          </button>
        ` : '';
        renderDashboardView(content);
      } else if (activeTab === 'students') {
        title.innerText = 'Student Directory Master';
        subtitle.innerText = 'Complete student profiles, emergency contacts, medical notes, and academic assignments';
        quickActions.innerHTML = `<button onclick="openAddStudentModal()" class="bg-sky-600 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center space-x-1 shadow"><i data-lucide="plus" class="w-4 h-4"></i><span>Add Student</span></button>`;
        renderStudentsView(content);
      } else if (activeTab === 'fees') {
        title.innerText = 'Fees, Invoicing & Payments';
        subtitle.innerText = 'Collection history, overdue fee tracking, and instant printable fee receipt generation';
        quickActions.innerHTML = `<button onclick="openCollectFeeModal()" class="bg-emerald-600 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center space-x-1 shadow"><i data-lucide="credit-card" class="w-4 h-4"></i><span>Collect Fee</span></button>`;
        renderFeesView(content);
      } else if (activeTab === 'attendance') {
        title.innerText = 'Student Attendance Register';
        subtitle.innerText = 'Mark daily class attendance, track absent logs, and monitor monthly consistency';
        quickActions.innerHTML = '';
        renderAttendanceView(content);
      } else if (activeTab === 'payroll') {
        title.innerText = 'Staff & Payroll Management';
        subtitle.innerText = 'Calculation: Basic Salary + Allowances + Overtime − Advances − Deductions = Net Salary';
        quickActions.innerHTML = '';
        renderPayrollView(content);
      } else if (activeTab === 'expenses') {
        title.innerText = 'School Expense Logger';
        subtitle.innerText = 'Track categories: Rent, Electricity, Toys, Food/Snacks, Stationery, Maintenance';
        quickActions.innerHTML = `<button onclick="openAddExpenseModal()" class="bg-amber-600 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center space-x-1 shadow"><i data-lucide="plus" class="w-4 h-4"></i><span>Add Expense</span></button>`;

        quickActions.innerHTML = '';
        renderLeavesView(content);

        quickActions.innerHTML = '';
        content.innerHTML = `<div class="bg-white p-8 rounded-xl border text-center text-slate-500">Module [${activeTab}] loaded successfully.</div>`;
      }
      lucide.createIcons();
    }

    // =========================================================================

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">

            <h3 class="text-3xl font-extrabold text-slate-800 mt-1">83.3%</h3>

              <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Fee Collection (Aug)</p>
              <h3 class="text-3xl font-extrabold text-slate-800 mt-1">₹${totalFeesCollected.toLocaleString()}</h3>
              <p class="text-xs text-indigo-600 font-semibold mt-1">Pending Fees: ₹${totalPendingFees.toLocaleString()}</p>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm border-l-4 border-l-amber-500">

    function printReceipt(receiptId) {

      if (!p) return;

      const modalOverlay = document.getElementById('modalOverlay');
      const modalContainer = document.getElementById('modalContainer');

      modalContainer.innerHTML = `

            <div class="flex justify-between pt-2 border-t font-bold text-base"><span class="text-slate-800">Amount Paid:</span><span class="text-emerald-600">₹${p.paid.toLocaleString()}</span></div>

      `;
      modalOverlay.classList.remove('hidden');

    function saveNewStudent() {
      const name = document.getElementById('new_name').value || 'New Student';
      const className = document.getElementById('new_class').value;
      const section = document.getElementById('new_sec').value;
      const father = document.getElementById('new_father').value || 'Parent';
      const mobile = document.getElementById('new_mobile').value || '9900000000';

      const newId = 's' + (STUDENTS.length + 1);
      const student_id = 'LW-2024-00' + (STUDENTS.length + 1);

      STUDENTS.push({
        id: newId, student_id, name, class: className, section, dob: '2021-01-01', gender: 'Boy', status: 'Active',
        father, mother: 'Mother', mobile, emergency: mobile, address: 'Campus Enclave', medical: 'None', pickup: 'Parents'
      });

      ATTENDANCE[newId] = 'Present';
      closeModal();
      setActiveTab('students');
    }

    function openAddExpenseModal() {
      const modalOverlay = document.getElementById('modalOverlay');
      const modalContainer = document.getElementById('modalContainer');

      modalContainer.innerHTML = `
        <h3 class="font-bold text-slate-900 text-lg border-b pb-2">Log Operational Expense</h3>
        <div class="space-y-3 text-xs">
          <div><label class="font-bold">Expense Category</label><select id="exp_cat" class="w-full p-2 border rounded-lg mt-1"><option>Toys & Teaching Materials</option><option>Food & Snacks</option><option>Stationery</option><option>Maintenance</option><option>Electricity</option><option>Marketing</option></select></div>

        <div class="flex space-x-2 pt-3 border-t">
          <button onclick="saveNewExpense()" class="flex-1 bg-amber-600 text-white py-2 rounded-xl font-bold text-xs">Log Expense</button>
          <button onclick="closeModal()" class="px-4 bg-slate-100 text-slate-700 py-2 rounded-xl font-bold text-xs">Cancel</button>
        </div>
      `;
      modalOverlay.classList.remove('hidden');
      modalOverlay.classList.add('flex');
    }

    function saveNewExpense() {
      const category = document.getElementById('exp_cat').value;
      const description = document.getElementById('exp_desc').value || 'Expense';
      const amount = parseFloat(document.getElementById('exp_amt').value) || 0;

      EXPENSES.unshift({
        id: 'e' + Date.now(),
        date: new Date().toISOString().split('T')[0],
        category, description, amount, mode: 'UPI', paid_by: currentUser.name, receipt: 'VOUCH-' + Math.floor(100+Math.random()*900)
      });

      closeModal();
      setActiveTab('expenses');
    }

    function openCollectFeeModal() {
      alert("Collection Modal: Select student and enter payment amount.");
    }

    function closeModal() {
      const modalOverlay = document.getElementById('modalOverlay');
      modalOverlay.classList.remove('flex');
      modalOverlay.classList.add('hidden');
    }

    // Initialize Dashboard on Load
    window.onload = function() {
      renderSidebar();
      renderCurrentView();
    };
  </script>
